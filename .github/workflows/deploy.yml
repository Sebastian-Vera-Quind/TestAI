name: Deploy

on:
  push:
    branches: [main]

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: 638183259942.dkr.ecr.us-east-1.amazonaws.com
  ECR_REPOSITORY: back-end

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get release version
        id: version
        run: echo "tag=$(git describe --tags --abbrev=0)" >> $GITHUB_OUTPUT

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: iac
        run: terraform init

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY_URL: ${{ secrets.ECR_REPOSITORY_URL }}
          IMAGE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          echo "Building Docker image..."
          docker build -t $ECR_REPOSITORY_URL:$IMAGE_TAG -t $ECR_REPOSITORY_URL:latest .
          
          echo "Pushing Docker image to ECR..."
          docker push $ECR_REPOSITORY_URL:$IMAGE_TAG
          docker push $ECR_REPOSITORY_URL:latest

      - name: Terraform Apply
        working-directory: iac
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

          TF_VAR_aws_region: ${{ env.AWS_REGION }}
          TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}

          TF_VAR_ecs_cluster_id: ${{ secrets.ECS_CLUSTER_ID }}
          TF_VAR_ecs_role_arn: ${{ secrets.ECS_ROLE_ARN }}

          TF_VAR_vpc_id: ${{ secrets.VPC_ID }}
          TF_VAR_app_subnet_ids: ${{ secrets.SUBNET_IDS }}
          TF_VAR_app_security_group_ids: ${{ secrets.SECURITY_GROUP_IDS }}

          TF_VAR_gateway_security_group_ids: ${{ secrets.GATEWAY_SECURITY_GROUP_IDS }}

          TF_VAR_alb_arn: ${{ secrets.ALB_ARN }}
          
          TF_VAR_container_image_url: ${{ secrets.ECR_REPOSITORY_URL }}
          TF_VAR_container_image_tag: ${{ steps.version.outputs.tag }}
          TF_VAR_container_port: 80

          TF_VAR_db_host: ${{ secrets.DB_HOST }}
          TF_VAR_db_port: ${{ secrets.DB_PORT }}
          TF_VAR_db_name: ${{ secrets.DB_NAME }}
          TF_VAR_db_username: ${{ secrets.DB_USERNAME }}
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
          TF_VAR_generate_openapi_docs: true
        run: terraform apply -auto-approve
