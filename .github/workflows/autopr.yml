name: Auto PR develop to release

on:
  pull_request:
    types: [closed]
    branches:
      - develop

permissions:
  contents: read
  pull-requests: write

jobs:
  create-pr-to-release:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Create PR develop to release if missing
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.CI_GH_TOKEN || github.token }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const base = "release";
            const head = `${owner}:develop`;

            const { data: openPulls } = await github.rest.pulls.list({
              owner,
              repo,
              state: "open",
              base,
              head,
            });

            if (openPulls.length > 0) {
              core.info(`Open PR already exists: #${openPulls[0].number}`);
              return;
            }

            const { data: created } = await github.rest.pulls.create({
              owner,
              repo,
              title: "chore: promote develop to release",
              head: "develop",
              base: "release",
              body: "PR creada automaticamente al hacer merge a develop.",
            });

            core.info(`Created PR #${created.number}`);